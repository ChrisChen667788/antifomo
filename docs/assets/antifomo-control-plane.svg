<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc"><title id="title">Anti-FOMO / architecture</title><desc id="desc">A local research workspace with explicit storage, provider and execution boundaries.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#458577"/></marker><style>text{font-family:Inter,Arial,'PingFang SC','Microsoft YaHei',sans-serif}.title{font-weight:700;font-size:48px;fill:#152e35}.subtitle{font-size:23px;fill:#526968}.heading{font-weight:700;font-size:28px;fill:#152e35}.body{font-size:21px;fill:#415d5c}.light{font-size:21px;fill:#e5f0eb}.eyebrow{font-weight:700;font-size:16px;letter-spacing:2px;fill:#1d7564}.box{fill:#fff;stroke:#bed5cd;stroke-width:2}.planned{fill:#f1f5f2;stroke:#7d9690;stroke-width:2;stroke-dasharray:9 7}.dark{fill:#1b4a42;stroke:#1b4a42;stroke-width:2}.arrow{fill:none;stroke:#458577;stroke-width:3}.return{fill:none;stroke:#458577;stroke-width:3;stroke-dasharray:9 7}.note{font-size:20px;fill:#526968}</style></defs><rect width="1600" height="920" rx="28" fill="#f6f8f4"/><text x="60" y="80" class="title">Anti-FOMO / architecture</text><text x="62" y="125" class="subtitle">A local research workspace with explicit storage, provider and execution boundaries.</text><g transform="translate(60 175)"><rect width="310" height="225" rx="20" class="box"/><text x="24" y="34" class="eyebrow">01 / EXPERIENCE</text><text x="24" y="73" class="heading">User surfaces</text><text x="24" y="110" class="body">Next.js web workspaces</text><text x="24" y="140" class="body">Inbox / Research / Studio</text><text x="24" y="170" class="body">Extension + Mini Program</text></g><g transform="translate(430 175)"><rect width="450" height="225" rx="20" class="box"/><text x="24" y="34" class="eyebrow">02 / APPLICATION</text><text x="24" y="73" class="heading">FastAPI services</text><text x="24" y="110" class="body">Collection + source health</text><text x="24" y="140" class="body">Research + retrieval + delivery</text><text x="24" y="170" class="body">Decision Studio + product strategy</text></g><g transform="translate(940 175)"><rect width="600" height="225" rx="20" class="box"/><text x="24" y="34" class="eyebrow">03 / PERSISTENCE</text><text x="24" y="73" class="heading">Local records + artifacts</text><text x="24" y="110" class="body">SQLite: sources, tasks, reports, revisions</text><text x="24" y="140" class="body">Retrieval index + model configuration</text><text x="24" y="170" class="body">Files, hashes, Office / visual receipts</text></g><path d="M370 287H430" class="arrow" marker-end="url(#arrow)"/><path d="M880 287H940" class="arrow" marker-end="url(#arrow)"/><g transform="translate(60 450)"><rect width="510" height="205" rx="20" class="box"/><text x="24" y="34" class="eyebrow">CURRENT / RESEARCH RUNTIME</text><text x="24" y="73" class="heading">Orchestration + providers</text><text x="24" y="110" class="body">Framework-neutral workflow / LangGraph</text><text x="24" y="140" class="body">Configured models + retrieval providers</text><text x="24" y="170" class="body">Deterministic orchestration fallback</text></g><g transform="translate(620 450)"><rect width="450" height="205" rx="20" class="box"/><text x="24" y="34" class="eyebrow">CURRENT / REVIEW SURFACES</text><text x="24" y="73" class="heading">Evidence + release decisions</text><text x="24" y="110" class="body">Claim graph / revision comparison</text><text x="24" y="140" class="body">Readiness, HOLD + acceptance records</text><text x="24" y="170" class="body">Receipts ≠ customer acceptance</text></g><g transform="translate(1120 450)"><rect width="420" height="205" rx="20" class="box"/><text x="24" y="34" class="eyebrow">CURRENT / LEGACY BRIDGE</text><text x="24" y="73" class="heading">WorkTask + CLI bridge</text><text x="24" y="110" class="body">Supported exports + callbacks</text><text x="24" y="140" class="body">Secret unset: signature bypass</text><text x="24" y="170" class="body">No universal approval gate</text></g><path d="M530 400V424H315V450" class="arrow" marker-end="url(#arrow)"/><path d="M655 400V424H845V450" class="arrow" marker-end="url(#arrow)"/><path d="M780 400V424H1330V450" class="arrow" marker-end="url(#arrow)"/><g transform="translate(60 705)"><rect width="1480" height="145" rx="20" class="planned"/><text x="24" y="34" class="eyebrow">PLANNED / 2.12–2.21</text><text x="24" y="73" class="heading">Governed execution extensions</text><text x="24" y="110" class="body">Envelope + provenance + approval • scoped connectors • recoverable jobs • team isolation • measured operations</text></g><text x="62" y="890" class="note">Implementation map, not a deployment SLA. Current local bridge behavior is separate from future execution controls.</text></svg>