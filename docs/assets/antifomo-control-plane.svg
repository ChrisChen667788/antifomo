<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">Anti-FOMO control-plane architecture</title>
  <desc id="desc">Conceptual architecture showing collection, evidence, decision and governance planes.</desc>
  <defs><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbfa"/><stop offset="1" stop-color="#e8f1ee"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity=".12"/></filter><style>.ink{fill:#13223b}.muted{fill:#5c6d7e}.label{font:700 27px ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.small{font:500 20px ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.mono{font:600 16px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.06em}.box{fill:#fff;stroke:#c7d8d3;stroke-width:2}.line{stroke:#719e95;stroke-width:3;fill:none;stroke-dasharray:8 10}.gate{fill:#12203a;stroke:#b3d4cb;stroke-width:2}</style></defs>
  <rect width="1600" height="820" rx="36" fill="url(#paper)"/>
  <text x="70" y="86" class="label ink" style="font-size:52px">Anti-FOMO / governed control plane</text>
  <text x="72" y="126" class="small muted">把采集、证据、方案和执行放进同一条可回放的工作流</text>
  <g transform="translate(70 180)">
    <rect width="330" height="470" rx="26" class="box" filter="url(#s)"/><text x="28" y="50" class="label ink">Collection plane</text><text x="28" y="84" class="small muted">输入与恢复</text>
    <g transform="translate(28 120)"><rect width="274" height="62" rx="14" fill="#edf5f2"/><text x="18" y="39" class="small ink">Web / RSS / Newsletter</text></g>
    <g transform="translate(28 198)"><rect width="274" height="62" rx="14" fill="#dbeee9"/><text x="18" y="39" class="small ink">WeChat Favorites</text></g>
    <g transform="translate(28 276)"><rect width="274" height="62" rx="14" fill="#edf5f2"/><text x="18" y="39" class="small ink">Files / extension / miniapp</text></g>
    <text x="28" y="404" class="mono muted">DEDUP · HEALTH · RETRY</text>
  </g>
  <g transform="translate(450 180)">
    <rect width="330" height="470" rx="26" class="box" filter="url(#s)"/><text x="28" y="50" class="label ink">Evidence plane</text><text x="28" y="84" class="small muted">研究与证据</text>
    <g transform="translate(28 120)"><rect width="274" height="62" rx="14" fill="#edf5f2"/><text x="18" y="39" class="small ink">Retrieval / routing</text></g>
    <g transform="translate(28 198)"><rect width="274" height="62" rx="14" fill="#dbeee9"/><text x="18" y="39" class="small ink">Claim / source ledger</text></g>
    <g transform="translate(28 276)"><rect width="274" height="62" rx="14" fill="#edf5f2"/><text x="18" y="39" class="small ink">Compare / archive / watch</text></g>
    <text x="28" y="404" class="mono muted">VERSION · DIGEST · HOLD</text>
  </g>
  <g transform="translate(830 180)">
    <rect width="330" height="470" rx="26" class="box" filter="url(#s)"/><text x="28" y="50" class="label ink">Decision plane</text><text x="28" y="84" class="small muted">方案与动作</text>
    <g transform="translate(28 120)"><rect width="274" height="62" rx="14" fill="#dbeee9"/><text x="18" y="39" class="small ink">Architecture readiness</text></g>
    <g transform="translate(28 198)"><rect width="274" height="62" rx="14" fill="#edf5f2"/><text x="18" y="39" class="small ink">Blueprint / ADR / risk</text></g>
    <g transform="translate(28 276)"><rect width="274" height="62" rx="14" fill="#dbeee9"/><text x="18" y="39" class="small ink">Focus / action / export</text></g>
    <text x="28" y="404" class="mono muted">CONTEXT · REVIEW · DELIVER</text>
  </g>
  <g transform="translate(1210 180)">
    <rect width="320" height="470" rx="26" class="gate" filter="url(#s)"/><text x="30" y="52" class="label" fill="#f5fbf8">Governance</text><text x="30" y="86" class="small" fill="#b4d0c8">权限与证据边界</text>
    <g transform="translate(30 122)"><rect width="260" height="66" rx="14" fill="#204a5b"/><text x="18" y="41" class="small" fill="#effaf6">Human review</text></g>
    <g transform="translate(30 204)"><rect width="260" height="66" rx="14" fill="#204a5b"/><text x="18" y="41" class="small" fill="#effaf6">Skill / connector scope</text></g>
    <g transform="translate(30 286)"><rect width="260" height="66" rx="14" fill="#204a5b"/><text x="18" y="41" class="small" fill="#effaf6">Audit / replay / rollback</text></g>
    <text x="30" y="410" class="mono" fill="#b4d0c8">FAIL CLOSED · OBSERVE · RECOVER</text>
  </g>
  <path d="M400 410H450M780 410H830M1160 410H1210" class="line"/><path d="M400 548H450M780 548H830M1160 548H1210" class="line"/>
  <text x="72" y="730" class="small muted">结构图是产品方向与边界的说明；具体接口、迁移和验收以仓库代码与版本文档为准。</text>
</svg>
