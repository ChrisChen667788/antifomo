<!DOCTYPE html>
<html lang="en">
  <head>

    <style>
      @font-face {
        font-family: "AntiFOMO Display";
        font-style: normal;
        font-weight: 400;
        src: url("assets/fonts/Montserrat-Regular.ttf") format("truetype");
      }
      @font-face {
        font-family: "AntiFOMO Display";
        font-style: normal;
        font-weight: 900;
        src: url("assets/fonts/Montserrat-Black.ttf") format("truetype");
      }
      @font-face {
        font-family: "AntiFOMO Mono";
        font-style: normal;
        font-weight: 400;
        src: url("assets/fonts/IBMPlexMono-Regular.ttf") format("truetype");
      }
      @font-face {
        font-family: "AntiFOMO Mono";
        font-style: normal;
        font-weight: 700;
        src: url("assets/fonts/IBMPlexMono-Bold.ttf") format("truetype");
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #f1f4ef;
        color: #142b30;
        font-family: "AntiFOMO Display", sans-serif;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      .masthead {
        position: absolute;
        left: 96px;
        right: 96px;
        top: 64px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .brand {
        font-size: 34px;
        font-weight: 900;
        letter-spacing: -1px;
      }
      .identity {
        font-family: "AntiFOMO Mono", monospace;
        font-size: 19px;
        font-weight: 400;
      }
      .footer {
        position: absolute;
        left: 96px;
        right: 96px;
        bottom: 46px;
        display: flex;
        justify-content: space-between;
        font-family: "AntiFOMO Mono", monospace;
        font-size: 19px;
        color: #425f62;
      }
      .track {
        position: absolute;
        left: 96px;
        right: 96px;
        bottom: 95px;
        height: 3px;
        background: #cad8cf;
      }
      .fill {
        height: 100%;
        width: 100%;
        background: #126e65;
        transform-origin: left center;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-0ywh" id="root" data-composition-id="anti-fomo-overview" data-width="1920" data-height="1080" data-duration="15">

      const tl = gsap.timeline({ paused: true });
      tl.fromTo(
        "#story-progress",
        { scaleX: 0 },

      window.__timelines["anti-fomo-overview"] = tl;
