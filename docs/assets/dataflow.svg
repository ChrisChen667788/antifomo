<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc"><title id="title">Anti-FOMO / data flow</title><desc id="desc">From an incoming link to a source-linked decision and a reviewable artifact.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#458577"/></marker><style>text{font-family:Inter,Arial,'PingFang SC','Microsoft YaHei',sans-serif}.title{font-weight:700;font-size:48px;fill:#152e35}.subtitle{font-size:23px;fill:#526968}.heading{font-weight:700;font-size:28px;fill:#152e35}.body{font-size:21px;fill:#415d5c}.light{font-size:21px;fill:#e5f0eb}.eyebrow{font-weight:700;font-size:16px;letter-spacing:2px;fill:#1d7564}.box{fill:#fff;stroke:#bed5cd;stroke-width:2}.planned{fill:#f1f5f2;stroke:#7d9690;stroke-width:2;stroke-dasharray:9 7}.dark{fill:#1b4a42;stroke:#1b4a42;stroke-width:2}.arrow{fill:none;stroke:#458577;stroke-width:3}.return{fill:none;stroke:#458577;stroke-width:3;stroke-dasharray:9 7}.note{font-size:20px;fill:#526968}</style></defs><rect width="1600" height="920" rx="28" fill="#f6f8f4"/><text x="60" y="80" class="title">Anti-FOMO / data flow</text><text x="62" y="125" class="subtitle">From an incoming link to a source-linked decision and a reviewable artifact.</text><g transform="translate(60 180)"><rect width="320" height="210" rx="20" class="box"/><text x="24" y="34" class="eyebrow">01 / CAPTURE</text><text x="24" y="73" class="heading">Source input</text><text x="24" y="110" class="body">URL / WeChat / file / RSS</text><text x="24" y="140" class="body">Capture + normalize URL</text><text x="24" y="170" class="body">Batch state + deduplication</text></g><g transform="translate(445 180)"><rect width="320" height="210" rx="20" class="box"/><text x="24" y="34" class="eyebrow">02 / RECOVER</text><text x="24" y="73" class="heading">Source records</text><text x="24" y="110" class="body">Reuse or create an item</text><text x="24" y="140" class="body">Health + freshness status</text><text x="24" y="170" class="body">Retry queue for failed input</text></g><g transform="translate(830 180)"><rect width="320" height="210" rx="20" class="box"/><text x="24" y="34" class="eyebrow">03 / RESEARCH</text><text x="24" y="73" class="heading">Retrieval + reports</text><text x="24" y="110" class="body">Question + permitted scope</text><text x="24" y="140" class="body">Context + citations + gaps</text><text x="24" y="170" class="body">Topic versions + snapshots</text></g><g transform="translate(1215 180)"><rect width="325" height="210" rx="20" class="box"/><text x="24" y="34" class="eyebrow">04 / COMPARE</text><text x="24" y="73" class="heading">Decision context</text><text x="24" y="110" class="body">Claim / evidence relations</text><text x="24" y="140" class="body">Changes + assumptions</text><text x="24" y="170" class="body">Architecture readiness</text></g><path d="M380 285H445" class="arrow" marker-end="url(#arrow)"/><path d="M765 285H830" class="arrow" marker-end="url(#arrow)"/><path d="M1150 285H1215" class="arrow" marker-end="url(#arrow)"/><g transform="translate(60 475)"><rect width="705" height="205" rx="20" class="box"/><text x="24" y="34" class="eyebrow">RECORDS / TRACEABILITY</text><text x="24" y="73" class="heading">Keep provenance with the work</text><text x="24" y="110" class="body">Source URL + status → report version → claim / decision context</text><text x="24" y="140" class="body">Artifact revision → hash / receipt → audit handoff index</text><text x="24" y="170" class="body">These are linked records; a receipt is not independent acceptance.</text></g><g transform="translate(830 475)"><rect width="710" height="205" rx="20" class="box"/><text x="24" y="34" class="eyebrow">05 / PREPARE</text><text x="24" y="73" class="heading">Reviewable deliverables</text><text x="24" y="110" class="body">Research / architecture / proposal drafts + follow-up actions</text><text x="24" y="140" class="body">Readiness and acceptance records remain visible in their surfaces</text><text x="24" y="170" class="body">Supported exports / callbacks use the existing WorkTask bridge.</text></g><path d="M1377 390V475" class="arrow" marker-end="url(#arrow)"/><path d="M1185 680V728H220V680" class="return" marker-end="url(#arrow)"/><text x="250" y="720" class="note">Evidence gap or rejected revision → revise the source, context or artifact</text><text x="62" y="810" class="note">Conceptual data flow grounded in collector, research, Decision Studio and product-strategy records.</text><text x="62" y="845" class="note">No single approval gate is claimed for every export, callback or CLI action. See the WorkBuddy integration plan.</text></svg>