<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc"><title id="title">Anti-FOMO / research workflow</title><desc id="desc">A question becomes a draft, a review decision and a concrete next step.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#458577"/></marker><style>text{font-family:Inter,Arial,'PingFang SC','Microsoft YaHei',sans-serif}.title{font-weight:700;font-size:48px;fill:#152e35}.subtitle{font-size:23px;fill:#526968}.heading{font-weight:700;font-size:28px;fill:#152e35}.body{font-size:21px;fill:#415d5c}.light{font-size:21px;fill:#e5f0eb}.eyebrow{font-weight:700;font-size:16px;letter-spacing:2px;fill:#1d7564}.box{fill:#fff;stroke:#bed5cd;stroke-width:2}.planned{fill:#f1f5f2;stroke:#7d9690;stroke-width:2;stroke-dasharray:9 7}.dark{fill:#1b4a42;stroke:#1b4a42;stroke-width:2}.arrow{fill:none;stroke:#458577;stroke-width:3}.return{fill:none;stroke:#458577;stroke-width:3;stroke-dasharray:9 7}.note{font-size:20px;fill:#526968}</style></defs><rect width="1600" height="920" rx="28" fill="#f6f8f4"/><text x="60" y="80" class="title">Anti-FOMO / research workflow</text><text x="62" y="125" class="subtitle">A question becomes a draft, a review decision and a concrete next step.</text><g transform="translate(60 180)"><rect width="430" height="210" rx="20" class="box"/><text x="24" y="34" class="eyebrow">01 / SCOPE</text><text x="24" y="73" class="heading">Start with a question</text><text x="24" y="110" class="body">Inbox brief + intended audience</text><text x="24" y="140" class="body">Allowed sources + known constraints</text><text x="24" y="170" class="body">Choose a narrow deliverable</text></g><g transform="translate(585 180)"><rect width="430" height="210" rx="20" class="box"/><text x="24" y="34" class="eyebrow">02 / INVESTIGATE</text><text x="24" y="73" class="heading">Run research + inspect</text><text x="24" y="110" class="body">Source health + retrieval diagnostics</text><text x="24" y="140" class="body">Report, citations + evidence gaps</text><text x="24" y="170" class="body">Compare versions before reuse</text></g><g transform="translate(1110 180)"><rect width="430" height="210" rx="20" class="box"/><text x="24" y="34" class="eyebrow">03 / PREPARE</text><text x="24" y="73" class="heading">Build the discussion</text><text x="24" y="110" class="body">Architecture options + dependencies</text><text x="24" y="140" class="body">Risks / assumptions / validation</text><text x="24" y="170" class="body">Candidate artifact + next actions</text></g><path d="M490 285H585" class="arrow" marker-end="url(#arrow)"/><path d="M1015 285H1110" class="arrow" marker-end="url(#arrow)"/><g transform="translate(1110 470)"><rect width="430" height="210" rx="20" class="box"/><text x="24" y="34" class="eyebrow">04 / REVIEW</text><text x="24" y="73" class="heading">Record a decision</text><text x="24" y="110" class="body">Human review for the chosen artifact</text><text x="24" y="140" class="body">Accept / return / HOLD with reason</text><text x="24" y="170" class="body">Customer acceptance stays separate</text></g><g transform="translate(585 470)"><rect width="430" height="210" rx="20" class="box"/><text x="24" y="34" class="eyebrow">05 / HANDOFF</text><text x="24" y="73" class="heading">Continue the work</text><text x="24" y="110" class="body">Focus / actions / supported exports</text><text x="24" y="140" class="body">Artifact revision + receipt + archive</text><text x="24" y="170" class="body">Check the actual bridge permissions</text></g><g transform="translate(60 470)"><rect width="430" height="210" rx="20" class="box"/><text x="24" y="34" class="eyebrow">RECOVERY / RETURN</text><text x="24" y="73" class="heading">Resolve the visible gap</text><text x="24" y="110" class="body">Broken source → retry / replace</text><text x="24" y="140" class="body">Weak claim → more evidence</text><text x="24" y="170" class="body">Returned draft → revise + review</text></g><path d="M1325 390V470" class="arrow" marker-end="url(#arrow)"/><path d="M1110 575H1015" class="arrow" marker-end="url(#arrow)"/><path d="M1325 680V730H275V680" class="return" marker-end="url(#arrow)"/><path d="M275 470V425H800V390" class="return" marker-end="url(#arrow)"/><text x="62" y="790" class="note">This is a recommended review workflow, not a universal runtime approval gate for existing bridge operations.</text><text x="62" y="830" class="note">Ask / Plan / Agent and stronger execution approval are planned additions in 2.12–2.21, not current mode controls.</text></svg>